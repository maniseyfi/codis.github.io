<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codis | آرشیو بازی‌های HTML</title>
<meta name="description" content="codis؛ آرشیو بازی‌های HTML رایگان و آنلاین. بدون نصب، مستقیم توی مرورگر گوشی و کامپیوتر بازی کن.">
<meta name="keywords" content="codis, بازی html, بازی آنلاین, بازی مرورگر, بازی موبایل, شوتر">
<link rel="canonical" href="https://codis.github.io/">
<link rel="icon" href="codis-logo.png">
<meta property="og:type" content="website">
<meta property="og:title" content="codis | آرشیو بازی‌های HTML">
<meta property="og:description" content="بازی‌های HTML رایگان و آنلاین، بدون نصب.">
<meta property="og:image" content="https://codis.github.io/codis-logo.png">
<meta property="og:url" content="https://codis.github.io/">
<meta name="theme-color" content="#0b0c12">
<!-- کد تأیید Google Search Console رو اینجا بذار:
<meta name="google-site-verification" content="CODE">
-->
<style>
:root{color-scheme:dark;--bg:#0b0c12;--pn:#161926;--bd:#2a2e44;--fg:#f2f4ff;--mu:#9aa0bd;--a1:#22e3ff;--a2:#8b5cff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#1a1d2e,var(--bg) 60%);color:var(--fg);font-family:Tahoma,system-ui,sans-serif;min-height:100vh;line-height:1.8}
header{text-align:center;padding:40px 16px 20px}
header img{width:110px;height:110px;border-radius:24px;box-shadow:0 0 40px #22e3ff33}
h1{margin:12px 0 4px;font-size:30px;font-family:ui-monospace,Menlo,Consolas,monospace;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:0;color:var(--mu)}
main{max-width:900px;margin:0 auto;padding:16px}
h2{font-size:18px;margin:20px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{display:block;text-decoration:none;color:inherit;background:var(--pn);border:1px solid var(--bd);border-radius:16px;overflow:hidden;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--a1)}
.th{height:130px;display:flex;align-items:center;justify-content:center;font-size:56px;background:linear-gradient(135deg,#1c2a4a,#3a1f5c)}
.bd{padding:14px}
.bd h3{margin:0 0 4px;font-size:17px}
.bd p{margin:0 0 10px;color:var(--mu);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:#22e3ff22;color:var(--a1);margin-left:6px}
.btn{display:inline-block;margin-top:2px;padding:6px 18px;border-radius:10px;background:linear-gradient(90deg,var(--a1),var(--a2));color:#06070b;font-weight:bold;font-size:14px}
.soon{opacity:.55}
footer{text-align:center;color:var(--mu);font-size:13px;padding:30px 16px}
</style>
</head>
<body>
<header>
<img src="codis-logo.png" alt="لوگوی codis" width="110" height="110">
<h1>codis</h1>
<p>آرشیو بازی‌های HTML؛ بدون نصب، مستقیم توی مرورگر</p>
</header>
<main>
<h2>بازی‌ها</h2>
<div class="grid">
<a class="card" href="shooter/">
<div class="th">🔫</div>
<div class="bd">
<h3>شوتر اول‌شخص</h3>
<p>دشمن‌ها رو بزن، سکه جمع کن و با پولش تفنگ و تیر بخر. گوشی رو افقی بگیر.</p>
<span class="tag">شوتر</span><span class="tag">موبایل</span><br><span class="btn">بازی کن</span>
</div>
</a>
<div class="card soon">
<div class="th">🎮</div>
<div class="bd"><h3>بازی بعدی</h3><p>به‌زودی...</p></div>
</div>
</div>
</main>
<footer>© codis | بازی‌های جدید به‌زودی اضافه میشن</footer>
</body>
</html>
